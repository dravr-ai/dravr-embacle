# ABOUTME: Tells dravr-platform an embacle release exists so its six pinned versions stop drifting
# ABOUTME: The platform's bump-embacle.yml takes it from there — bump, CI gate, merge, deploy
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai
#
# One end of the wire; dravr-platform's bump-embacle.yml is the other. embacle was the
# last satellite without one: photograveur, contremaitre and sciotte each notify the
# platform on release, while embacle's six version pins across four manifests were
# moved by whoever remembered. v0.21.3 was landed that way on 2026-08-24.
#
# Announces the version rather than the SHA because the platform consumes embacle from
# crates.io, so the version IS the address. The platform verifies it against the
# registry before acting on it — this dispatch is a prompt, not an authority.

name: "Notify Platform of Release"

# Called by release.yml rather than triggered by `on: release`. The release is created
# with the default GITHUB_TOKEN, and GitHub does not start workflow runs from events a
# GITHUB_TOKEN produced — so an `on: release` trigger here could never fire. That is
# exactly how sciotte's notifier logged zero runs across five releases while looking
# perfectly wired. A trigger that cannot fire is worse than no trigger.
on:
  workflow_call:
    inputs:
      version:
        description: "Release to announce, with or without the v prefix"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release to announce (defaults to the latest release)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # The dispatch itself — version without its v prefix, the tag's commit sha, pipefail —
  # is dravr-build-config's notify-release.yml, shared by every satellite.
  notify:
    name: Dispatch embacle-released to dravr-platform
    uses: dravr-ai/dravr-build-config/.github/workflows/notify-release.yml@main
    with:
      event: embacle-released
      version: ${{ inputs.version }}
    secrets:
      DISPATCH_TOKEN: ${{ secrets.DRAVR_PLATFORM_DISPATCH_TOKEN }}
