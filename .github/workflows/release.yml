# ABOUTME: Cuts an embacle release through dravr-build-config's release-crate.yml, called twice
# ABOUTME: Bump and tag first; binaries, image and crates.io only once all four platforms built

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Bumps the four crates in lockstep, commits, pushes main and the tag atomically,
  # and creates the GitHub release the binaries below attach to. Nothing is published
  # yet: crates.io waits for the build on every platform (see publish).
  release:
    name: Bump, tag and release
    uses: dravr-ai/dravr-build-config/.github/workflows/release-crate.yml@main
    with:
      bump: ${{ inputs.bump }}
      members: crates/embacle-mcp crates/embacle-server crates/embacle-tool-host

  build:
    name: Build (${{ matrix.target }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          TARGET="${{ matrix.target }}"
          DIR="embacle-v${VERSION}-${TARGET}"
          mkdir "$DIR"
          cp "target/${TARGET}/release/embacle-mcp" "$DIR/"
          cp "target/${TARGET}/release/embacle-server" "$DIR/"
          tar czf "${DIR}.tar.gz" "$DIR"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.release.outputs.version }}"
          $TARGET = "${{ matrix.target }}"
          $DIR = "embacle-v${VERSION}-${TARGET}"
          New-Item -ItemType Directory -Path $DIR
          Copy-Item "target/${TARGET}/release/embacle-mcp.exe" "$DIR/"
          Copy-Item "target/${TARGET}/release/embacle-server.exe" "$DIR/"
          Compress-Archive -Path "$DIR/*" -DestinationPath "${DIR}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: embacle-${{ matrix.target }}
          path: embacle-v*.*
          retention-days: 7

  docker:
    name: Docker Image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dravr-ai/embacle:${{ needs.release.outputs.version }}
            ghcr.io/dravr-ai/embacle:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  attach-binaries:
    name: Attach binaries to the GitHub release
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: embacle-*
          merge-multiple: true

      - name: Attach to the GitHub Release
        # The release job created the release, with its notes; this only adds files.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: artifacts/*

  # The same shared workflow in tag mode: it publishes the tag the release job pushed,
  # and nothing else. Called separately so crates.io only ever carries a version that
  # built on all four platforms. Each crate goes after the ones it depends on; a re-run
  # skips any crate already on the registry, and every other failure fails the job.
  publish:
    name: Publish to crates.io
    needs: [release, build]
    uses: dravr-ai/dravr-build-config/.github/workflows/release-crate.yml@main
    with:
      tag: v${{ needs.release.outputs.version }}
      publish: embacle embacle-mcp embacle-server embacle-tool-host
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  update-homebrew:
    name: Update Homebrew
    # The formula points at the release's assets, so they must be attached first.
    needs: [release, build, publish, attach-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: dravr-ai/homebrew-tap
          token: ${{ secrets.RELEASE_PAT }}

      - name: Download artifacts for SHA computation
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: embacle-*
          merge-multiple: true

      - name: Update formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          SHA_ARM=$(shasum -a 256 artifacts/embacle-v${VERSION}-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          SHA_X86_MAC=$(shasum -a 256 artifacts/embacle-v${VERSION}-x86_64-apple-darwin.tar.gz | awk '{print $1}')
          SHA_LINUX=$(shasum -a 256 artifacts/embacle-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')

          cat > Formula/embacle.rb <<FORMULA
          # typed: false
          # frozen_string_literal: true

          class Embacle < Formula
            desc "LLM runner that wraps AI CLI tools as a unified OpenAI-compatible API + MCP server"
            homepage "https://github.com/dravr-ai/dravr-embacle"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/dravr-ai/dravr-embacle/releases/download/v#{version}/embacle-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM}"
              else
                url "https://github.com/dravr-ai/dravr-embacle/releases/download/v#{version}/embacle-v#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_MAC}"
              end
            end

            on_linux do
              url "https://github.com/dravr-ai/dravr-embacle/releases/download/v#{version}/embacle-v#{version}-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "embacle-server"
              bin.install "embacle-mcp"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/embacle-server --version")
              assert_match version.to_s, shell_output("#{bin}/embacle-mcp --version")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/embacle.rb

      - name: Compute source tarball SHA for FFI formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          curl -sL "https://github.com/dravr-ai/dravr-embacle/archive/refs/tags/v${VERSION}.tar.gz" -o source.tar.gz
          SHA_SRC=$(shasum -a 256 source.tar.gz | awk '{print $1}')
          rm source.tar.gz

          cat > Formula/embacle-ffi.rb <<FORMULA
          # typed: false
          # frozen_string_literal: true

          class EmbacleFfi < Formula
            desc "C FFI static library for embacle LLM runners (Swift/C integration)"
            homepage "https://github.com/dravr-ai/dravr-embacle"
            url "https://github.com/dravr-ai/dravr-embacle/archive/refs/tags/v${VERSION}.tar.gz"
            sha256 "${SHA_SRC}"
            license "Apache-2.0"

            depends_on "rust" => :build

            def install
              system "cargo", "build", "--release", "--features", "ffi"
              lib.install "target/release/libembacle.a"
              include.install "include/embacle.h"
            end

            test do
              assert_match "embacle_init", shell_output("nm #{lib}/libembacle.a")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/embacle-ffi.rb

      - name: Commit and push
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/embacle.rb Formula/embacle-ffi.rb
          git commit -m "chore: bump embacle to v${VERSION}"
          git push

  # Final gate: now that the tap formula points at this release, install it
  # via brew + exercise the FFI lib end-to-end. A tag push cannot auto-trigger
  # homebrew.yml (release.yml pushes the tag with GITHUB_TOKEN, which does not
  # fire downstream workflows), so call it here — after the formula is live —
  # and pass the released version for an exact version-match check.
  validate-homebrew:
    name: Validate Homebrew install
    needs: [release, update-homebrew]
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.release.outputs.version }}

  # ---------------------------------------------------------------------------
  # Tell dravr-platform this release exists, so its six pins stop drifting.
  # ---------------------------------------------------------------------------
  #
  # Gated on `publish`, not on the homebrew jobs: the platform consumes embacle from
  # crates.io, so `publish` is the moment the release becomes reachable for it. The
  # tap is orthogonal, and making the platform integration wait behind it would park
  # a coaching fix behind a brew formula.
  #
  # `publish` is also the honest gate for a different reason — it is where a partial
  # publish shows up. The platform verifies the registry itself before bumping, but
  # not announcing a release whose crates never uploaded keeps that check a backstop
  # rather than the primary signal.
  notify-platform:
    name: Announce the release to dravr-platform
    needs: [release, publish]
    uses: ./.github/workflows/notify-platform-release.yml
    secrets: inherit
    with:
      version: ${{ needs.release.outputs.version }}
