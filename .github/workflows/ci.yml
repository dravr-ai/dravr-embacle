name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "debug/**", "feature/**", "features/**", "fix/**", "claude/**", "copilot/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-features so feature-gated code is linted too. Without it, modules
      # behind a non-default feature are never compiled here and accumulate
      # lints invisibly — agui.rs carried a map().unwrap_or() violation that
      # only ever appeared when someone happened to lint locally with the flag.
      - run: cargo clippy --workspace --all-targets --all-features --quiet

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The HTTP providers and the price-key check are
      # feature-gated: without this step their tests are only type-checked by
      # the --all-features clippy lane and never execute. The price-key check
      # asks every runner for its name, so it needs every runner feature. No
      # secrets — the live cases in these files are env-gated and skip.
      # `agui` and `quota-http` are here for tests/agui.rs and tests/e2e_router.rs,
      # which gate on them and never ran before 2026-09-23 (19 tests in all);
      # both features pull no extra dependency.
      - name: HTTP API provider tests
        run: cargo test --workspace --features http-api,copilot-headless,copilot-sdk,web-ui,agui,quota-http

  # The live Copilot tests drive the REAL binaries — `copilot --acp` and the
  # `copilot-runtime` pair the SDK loads — against a model this job provisions
  # on the runner. No GitHub account is involved and no secret is read.
  #
  # They used to run on a real Copilot subscription, on every push — the one
  # the dev deployment serves athletes from, so every push spent premium
  # requests out of the budget athletes are answered from. What these tests
  # verify is embacle's wiring to the Copilot binaries — the ACP handshake,
  # streaming, usage, the system slot, tool calls — and none of that depends
  # on whose model answers.
  #
  # The Copilot CLI routes to a custom provider when COPILOT_PROVIDER_BASE_URL
  # is set and needs no GitHub authentication then; COPILOT_OFFLINE=true cuts
  # every other GitHub call, so a misconfigured lane cannot reach an account
  # even if a credential were present.
  copilot-e2e:
    name: Copilot E2E (local Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 3B is the smallest Qwen 2.5 that drives the ACP tool turn: 1.5B answers
      # it "Error: No response was returned." with zero tool calls, and 7B
      # overran the ACP read timeout on an M2 GPU, let alone four vCPUs.
      E2E_MODEL_TAG: qwen2.5:3b-instruct-q4_K_M
      E2E_MODEL: embacle-e2e
      COPILOT_OFFLINE: "true"
      COPILOT_PROVIDER_BASE_URL: http://127.0.0.1:11434/v1
      COPILOT_PROVIDER_MAX_PROMPT_TOKENS: "32768"
      COPILOT_HEADLESS_MODEL: embacle-e2e
      COPILOT_SDK_MODEL: embacle-e2e
      # `copilot --acp` sends ~6-10k tokens of its own system prompt and tool
      # definitions on every cold turn, and a CPU runner evaluates them far
      # slower than the defaults allow for a hosted model.
      EMBACLE_ACP_MESSAGE_TIMEOUT_SECS: "900"
      EMBACLE_ACP_PROMPT_TIMEOUT_SECS: "1200"
      EMBACLE_ACP_SESSION_TIMEOUT_SECS: "180"
      EMBACLE_SDK_PROMPT_TIMEOUT_SECS: "900"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2

      # Restored before the server starts, so it opens a store that already
      # holds the weights and its startup prune sees their manifests.
      - name: Cache Ollama model store
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b-instruct-q4_K_M-v1

      - name: Install Ollama
        run: |
          for attempt in 1 2 3 4; do
            if curl -fsSL https://ollama.com/install.sh | sh; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              echo "ERROR: ollama install exhausted retries" >&2
              exit 1
            fi
            echo "ollama install failed on attempt $attempt; retrying in 10s..."
            sleep 10
          done
          # The installer starts a systemd unit running as the `ollama` user,
          # whose model store is not under this user's home and so is not what
          # the cache step below saves. Serve as the runner user instead.
          sudo systemctl disable --now ollama
          # Ollama's default context is 4096 and it truncates a longer prompt
          # WITHOUT an error: Copilot's prompt arrived as 2050 tokens and the
          # model answered nonsense the old assertions accepted.
          OLLAMA_CONTEXT_LENGTH=32768 OLLAMA_KEEP_ALIVE=120m \
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/version >/dev/null; then
              echo "Ollama ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Ollama did not answer on :11434" >&2
          cat "$RUNNER_TEMP/ollama.log" >&2
          exit 1

      - name: Pull the model and warm it up
        run: |
          # The registry occasionally resets the connection mid-pull; `ollama
          # pull` resumes from the layers it has.
          for attempt in 1 2 3 4; do
            if ollama pull "$E2E_MODEL_TAG"; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              echo "ERROR: model pull exhausted retries" >&2
              exit 1
            fi
            echo "pull failed on attempt $attempt; retrying in 10s..."
            sleep 10
          done
          # num_thread 4 uses every vCPU of the standard runner.
          printf 'FROM %s\nPARAMETER num_thread 4\nPARAMETER num_ctx 32768\n' "$E2E_MODEL_TAG" \
            > "$RUNNER_TEMP/Modelfile"
          ollama create "$E2E_MODEL" -f "$RUNNER_TEMP/Modelfile"
          ollama list
          # One inference maps the weights before a test's clock is running,
          # and proves the endpoint the tests will use answers at all. Only
          # that: a 3B answered "PING" here once, and what it says is the
          # tests' verdict to give, not the warm-up's.
          reply="$(curl -fsS -X POST http://127.0.0.1:11434/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"$E2E_MODEL\",\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly: PONG\"}]}")"
          echo "$reply"
          test -n "$(echo "$reply" | jq -er '.choices[0].message.content | select(length > 0)')"

      # A prefix this user owns, not npm's global one: Ollama's installer
      # re-creates /usr/local/bin as root:root 755 (`install -o0 -g0 -m755 -d`),
      # after which `npm install -g` fails there with EACCES on its symlink.
      - name: Install Copilot CLI
        run: |
          PREFIX="$HOME/.copilot-cli"
          npm install -g --prefix "$PREFIX" @github/copilot-linux-x64
          ln -sf "$PREFIX/bin/copilot-linux-x64" "$PREFIX/bin/copilot"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/copilot" --version

      - name: Build the live tests
        run: cargo test --workspace --features copilot-headless,copilot-sdk --test e2e --test e2e_cli_notice --test copilot_sdk_live_test --no-run

      # One thread: the runner serves one model, and turns queued behind each
      # other would spend their timeouts waiting rather than running.
      #
      # The verdict is the exit status, then two markers — never the absence of
      # a finding. A gated test that was not enabled prints SKIP and PASSES, so
      # a lane whose switch is misspelt would be green having run nothing.
      #
      # The second binary drives the CLI into refusing a turn itself — a prompt
      # budget far below its own static context, so no model is called — and
      # proves that refusal comes back as an error rather than as reply text.
      - name: Copilot Headless (ACP) E2E
        env:
          EMBACLE_E2E_COPILOT_HEADLESS: "1"
        run: |
          log="$RUNNER_TEMP/e2e-headless.log"
          status=0
          {
            cargo test --features copilot-headless,copilot-sdk --test e2e -- headless:: --test-threads=1 --nocapture &&
            EMBACLE_E2E_COPILOT_CLI_NOTICE=1 COPILOT_PROVIDER_BASE_URL=http://127.0.0.1:9/v1 \
              COPILOT_PROVIDER_MAX_PROMPT_TOKENS=3000 \
              cargo test --features copilot-headless,copilot-sdk --test e2e_cli_notice -- --nocapture
          } > "$log" 2>&1 || status=$?
          cat "$log"
          [ "$status" -eq 0 ] || { echo "ERROR: the ACP tests failed (exit $status)" >&2; exit 1; }
          if grep -q 'SKIP' "$log"; then echo "ERROR: a gated ACP test skipped" >&2; exit 1; fi
          [ "$(grep -Ec '^test result: ok\. [1-9][0-9]* passed' "$log")" -ge 2 ] || { echo "ERROR: an ACP test binary ran nothing" >&2; exit 1; }

      # The SDK runner needs the runtime pair (copilot-runtime + runtime.node),
      # which the `copilot --version` above extracted into the SEA's package
      # cache. `test -x` fails the job closed when the pair is not where the
      # loader put it, rather than letting the gated tests skip silently.
      - name: Copilot SDK E2E
        env:
          EMBACLE_E2E_COPILOT_SDK: "1"
        run: |
          RUNTIME="$(ls -d "$HOME"/.cache/copilot/pkg/linux-x64/*/prebuilds/linux-x64/copilot-runtime | sort -V | tail -1)"
          test -x "$RUNTIME"
          echo "runtime: $RUNTIME"
          export COPILOT_RUNTIME_PATH="$RUNTIME"
          log="$RUNNER_TEMP/e2e-sdk.log"
          status=0
          {
            cargo test --features copilot-headless,copilot-sdk --test e2e -- sdk:: --test-threads=1 --nocapture &&
            cargo test --workspace --features copilot-headless,copilot-sdk --test copilot_sdk_live_test -- --test-threads=1 --nocapture
          } > "$log" 2>&1 || status=$?
          cat "$log"
          [ "$status" -eq 0 ] || { echo "ERROR: the SDK tests failed (exit $status)" >&2; exit 1; }
          if grep -q 'SKIP' "$log"; then echo "ERROR: a gated SDK test skipped" >&2; exit 1; fi
          [ "$(grep -Ec '^test result: ok\. [1-9][0-9]* passed' "$log")" -ge 2 ] || { echo "ERROR: an SDK test binary ran nothing" >&2; exit 1; }

      - name: Ollama log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/ollama.log" || true

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  validate:
    name: Architectural Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Run architectural validation
        run: .build/validation/validate.sh

  # Rehearsal: catch anything that would break `cargo publish` at release
  # time (git deps in a manifest, missing description, version mismatch
  # between embacle / embacle-mcp / embacle-server, etc.) on every PR
  # instead of finding out months later that crates.io has drifted.
  # `--dry-run` builds the package tarball and runs the same verification
  # crates.io does without uploading or needing a token.
  #
  # All four crates are published in ONE invocation: embacle-mcp/-server/
  # -tool-host depend on `embacle = "<this version>"`, which is not on
  # crates.io until release time. A per-crate dry-run resolves those deps against the registry
  # and fails ("failed to select a version for the requirement `embacle`").
  # A workspace co-publish makes cargo treat the to-be-published sibling
  # versions as available and resolve them locally in dependency order.
  publish-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p embacle -p embacle-mcp -p embacle-server -p embacle-tool-host --dry-run
