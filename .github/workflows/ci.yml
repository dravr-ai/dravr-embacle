name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "debug/**", "feature/**", "features/**", "fix/**", "claude/**", "copilot/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-features so feature-gated code is linted too. Without it, modules
      # behind a non-default feature are never compiled here and accumulate
      # lints invisibly — agui.rs carried a map().unwrap_or() violation that
      # only ever appeared when someone happened to lint locally with the flag.
      - run: cargo clippy --workspace --all-targets --all-features --quiet -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    env:
      HAS_COPILOT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
      # The Rust runtime resolves its token itself and wants a user token with
      # Copilot access (a fine-grained PAT needs the `Copilot Requests`
      # permission; a `gho_` OAuth token works); the ACP adapter's own token
      # exchange accepts the PAT COPILOT_GITHUB_TOKEN holds, which the runtime
      # answers "Not authenticated". Two shapes, two secrets.
      HAS_COPILOT_SDK_TOKEN: ${{ secrets.COPILOT_SDK_GITHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The HTTP providers, the OpenAI runner and the price-key check are
      # feature-gated: without this step their tests are only type-checked by
      # the --all-features clippy lane and never execute. The price-key check
      # asks every runner for its name, so it needs every runner feature. No
      # secrets — the live cases in these files are env-gated and skip.
      - name: HTTP API provider tests
        run: cargo test --workspace --features http-api,openai-api,copilot-headless,copilot-sdk,web-ui
      - name: Install Copilot CLI
        if: env.HAS_COPILOT_TOKEN == 'true'
        run: |
          npm install -g @github/copilot-linux-x64
          NPM_PREFIX="$(npm prefix -g)"
          ln -sf "$NPM_PREFIX/bin/copilot-linux-x64" /usr/local/bin/copilot
          copilot --version
      - name: Copilot Headless E2E
        if: env.HAS_COPILOT_TOKEN == 'true'
        run: cargo test --workspace --features copilot-headless
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          EMBACLE_E2E_COPILOT_HEADLESS: "1"
      # The SDK runner needs the runtime pair (copilot-runtime + runtime.node),
      # which the `copilot --version` above extracted into the SEA's package
      # cache. `test -x` fails the job closed when the pair is not where the
      # loader put it, rather than letting the gated tests skip silently.
      - name: Copilot SDK E2E
        if: env.HAS_COPILOT_TOKEN == 'true' && env.HAS_COPILOT_SDK_TOKEN == 'true'
        run: |
          RUNTIME="$(ls -d "$HOME"/.cache/copilot/pkg/linux-x64/*/prebuilds/linux-x64/copilot-runtime | sort -V | tail -1)"
          test -x "$RUNTIME"
          echo "runtime: $RUNTIME"
          COPILOT_RUNTIME_PATH="$RUNTIME" cargo test --workspace --features copilot-headless,copilot-sdk
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_SDK_GITHUB_TOKEN }}
          EMBACLE_E2E_COPILOT_SDK: "1"

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  validate:
    name: Architectural Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Run architectural validation
        run: .build/validation/validate.sh

  # Rehearsal: catch anything that would break `cargo publish` at release
  # time (git deps in a manifest, missing description, version mismatch
  # between embacle / embacle-mcp / embacle-server, etc.) on every PR
  # instead of finding out months later that crates.io has drifted.
  # `--dry-run` builds the package tarball and runs the same verification
  # crates.io does without uploading or needing a token.
  #
  # All four crates are published in ONE invocation: embacle-mcp/-server/
  # -tool-host depend on `embacle = "<this version>"`, which is not on
  # crates.io until release time. A per-crate dry-run resolves those deps against the registry
  # and fails ("failed to select a version for the requirement `embacle`").
  # A workspace co-publish makes cargo treat the to-be-published sibling
  # versions as available and resolve them locally in dependency order.
  publish-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p embacle -p embacle-mcp -p embacle-server -p embacle-tool-host --dry-run
