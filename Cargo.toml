# ABOUTME: Standalone LLM runner library wrapping 12 AI CLI tools, ACP, and HTTP APIs as pluggable providers
# ABOUTME: CLI tools (Claude Code, Copilot, Cursor Agent, OpenCode, Gemini, Codex, Goose, Cline, Continue, Warp, Kiro, Kilo), ACP, and HTTP (Gemini, Cohere, Groq, OpenRouter, OpenAI-compatible)

[workspace]
members = [".", "crates/embacle-mcp", "crates/embacle-server", "crates/embacle-tool-host"]

[package]
name = "embacle"
version = "0.28.0"
edition = "2021"
license = "Apache-2.0"
description = "LLM runner library — 12 AI CLI tools, ACP, and HTTP APIs (Gemini, Cohere, Groq, OpenRouter, OpenAI-compatible) as pluggable LLM providers with fallback chains, agent loop, guardrails, and cost tracking"
repository = "https://github.com/dravr-ai/dravr-embacle"
homepage = "https://github.com/dravr-ai/dravr-embacle"
documentation = "https://docs.rs/embacle"
keywords = ["llm", "cli", "ai", "mcp", "openai"]
categories = ["command-line-utilities", "api-bindings"]
readme = "README.md"
exclude = [".claude/", ".githooks/", ".github/", "scripts/", "AGENTS.md", "crates/"]

# ============================================================================
# Build Profiles
# ============================================================================

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# ============================================================================
# Workspace Lint Configuration
# ============================================================================
# Shared across all workspace crates via [lints] workspace = true.
# Individual crates inherit these settings automatically.
#
# ZERO TOLERANCE ENFORCEMENT:
#   cargo clippy (reads this config, applies level = "deny")

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Base configuration: Enable clippy lint groups at DENY level
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Error-handling restriction lints — parity with dravr-platform's zero-tolerance policy
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
str_to_string = "deny"


# Type conversion casts - allowed when properly validated
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

# Const fn suggestions - clippy suggests const for methods that can't be const
missing_const_for_fn = "allow"

# Significant drop tightening - false positives with async lock guards
significant_drop_tightening = "allow"

# Module naming - allow repetition for clarity
module_name_repetitions = "allow"

# Enforce `use` imports over inline qualified paths (crate::foo::bar)
# Idiomatic Rust prefers imports at top of file for readability
absolute_paths = "deny"

# Multiple dependency versions - unavoidable in some transitive deps
multiple_crate_versions = "allow"

# Missing errors doc - not all error returns need doc comments
missing_errors_doc = "allow"

# must_use candidate - too noisy for builders and constructors
must_use_candidate = "allow"

# return_self_not_must_use - builder pattern methods
return_self_not_must_use = "allow"

# redundant_pub_crate - explicit visibility is clearer
redundant_pub_crate = "allow"

# unnecessary_literal_bound - false positives with async trait lifetimes
unnecessary_literal_bound = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["lib", "staticlib"]

[features]
default = []
# Enable AG-UI (Agent-User Interaction) protocol event schema and emitter trait.
# See https://github.com/ag-ui-protocol/ag-ui. Pulls in no extra dependencies.
agui = []
# Enable Copilot Headless provider (ACP protocol via copilot --acp)
copilot-headless = ["dep:agent-client-protocol-schema", "tokio/sync"]
# Enable the Copilot SDK provider: GitHub's Rust runtime through github-copilot-sdk
# over stdio (spawns the Rust `copilot-runtime` wrapper; no Node in the path).
# `.cargo/config.toml` keeps the SDK's build script from downloading and embedding
# the CLI; the runtime pair is a file `COPILOT_RUNTIME_PATH` names at run time.
copilot-sdk = ["dep:github-copilot-sdk", "tokio/sync"]
# Enable the HTTP API providers: Gemini, Cohere, Groq, OpenRouter, and any
# OpenAI-compatible endpoint (Ollama, vLLM, LocalAI) — reqwest-based, with the
# shared SSE parser, retry policy and HTTP error mapping in `http_api`.
http-api = ["dep:reqwest", "tokio/sync"]
# Enable OpenAI-compatible HTTP API client runner (reqwest-based). Shares
# http-api's client, SSE parser and error mapping.
openai-api = ["http-api"]
# Enable the HTTP quota checkers (Anthropic OAuth usage, GitHub rate-limit headroom).
# The quota vocabulary and policy in `quota` are always available; this only adds
# the checkers that reach the network.
quota-http = ["dep:reqwest", "tokio/sync"]
# Enable browser-driven web-UI provider (drives Claude.ai via a headless profile)
web-ui = ["dep:dravr-browser", "dep:toml", "tokio/sync"]
# Enable TOML-based configuration file loading
config-file = ["dep:toml", "dep:dirs"]
# Enable OpenTelemetry metrics export
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk"]
# Enable C FFI static library for Swift/C integration (implies copilot-headless)
ffi = ["copilot-headless"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bitflags = { version = "2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.45", features = ["process", "io-util", "time", "rt", "rt-multi-thread", "macros", "fs"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tracing = "0.1"
uuid = { version = "1.22", features = ["v4", "serde"] }
which = "7"

# Optional: ACP schema types for Copilot Headless (copilot --acp)
agent-client-protocol-schema = { version = "0.12", optional = true }

# Optional: GitHub's SDK for its Rust Copilot runtime (copilot-sdk feature).
# default-features = false drops `bundled-cli`, which would embed the CLI.
github-copilot-sdk = { version = "1.0.14", default-features = false, optional = true }

# Optional: HTTP client for the http-api providers and the OpenAI API runner
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }

# Optional: TOML config file support
toml = { version = "1.1", optional = true }
dirs = { version = "6", optional = true }

# Optional: shared headless-browser primitives for the web-ui runner
dravr-browser = { version = "0.1", optional = true }

# Optional: OpenTelemetry metrics export
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }

[dev-dependencies]
tokio = { version = "1.45", features = ["full", "test-util"] }
serde_json = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "eviction_bench"
harness = false

[[example]]
name = "test_claude_e2e"
path = "examples/test_claude_e2e.rs"

[[example]]
name = "ollama_openai_tools"
path = "examples/ollama_openai_tools.rs"
required-features = ["openai-api"]

[[example]]
name = "web_login"
path = "examples/web_login.rs"
required-features = ["web-ui"]

[[example]]
name = "web_query"
path = "examples/web_query.rs"
required-features = ["web-ui"]

[[example]]
name = "claude_code_mcp_smoke"
path = "examples/claude_code_mcp_smoke.rs"

[[example]]
name = "quota_probe"
path = "examples/quota_probe.rs"
required-features = ["quota-http"]

[[example]]
name = "acp_model_smoke"
path = "examples/acp_model_smoke.rs"
required-features = ["copilot-headless"]

[[example]]
name = "acp_usage_probe"
required-features = ["copilot-headless"]

[[example]]
name = "acp_cache_boundary_probe"
required-features = ["copilot-headless"]

[[example]]
name = "copilot_tool_disowning"
path = "examples/copilot_tool_disowning.rs"
required-features = ["copilot-headless"]

[lints]
workspace = true
